<lib-view-header
  [icon]="titleIcon"
  [title]="`${'INTEGRATIONS.DETAILS.TITLE' | translate} - ${(viewModeKey() | translate).toLowerCase()}`"
  [actions]="actions"
  (headerEvent)="handleActionEvent($event)">

  <lib-form-section [title]="'INTEGRATIONS.DETAILS.FORMS.BASIC.SECTION_NAME' | translate">

  @if (viewMode() === 'Preview' ) {
    <!-- TODO -->
  }
  @else {
    <form [formGroup]="basicDataForm" ngxsForm="integration.basicForm" class="basic-data-form">

      <mat-form-field class="full-length-form-field">
        <mat-label>{{ 'INTEGRATIONS.DETAILS.FORMS.BASIC.FIELDS.NAME' | translate }}</mat-label>
        <input matInput formControlName="name">
        <mat-error libControlError [control]="basicDataForm.controls.name"></mat-error>
      </mat-form-field>

    </form>
    }
  </lib-form-section>

  <lib-form-section [title]="'INTEGRATIONS.DETAILS.FORMS.REPOSITORIES.SECTION_NAME' | translate">

    <lib-data-grid
      [gridColumns]="repositoriesGridColumns"
      [rows]="repositories()"
      [rowActions]="repositoriesGridRowActions"
      [emptyGridBehavior]="repositoriesGridEmptyBehavior"
      (gridRowActionEvent)="handleRepositoryRowAction($event)"></lib-data-grid>

  </lib-form-section>

</lib-view-header>
